<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Photo Report Creator v7.0 self-test</title>
</head>
<body>
  <pre id="out">running...</pre>

  <script>
    // The same page is also opened with ?nopica to verify that the compressor
    // degrades to native downscaling when pica.min.js is not available.
    if (window.location.search.indexOf('nopica') === -1) {
      document.write('<script src="../pica.min.js"><\/script>');
    }
  </script>
  <script src="../compressor.js"></script>
  <script src="../layout.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <script src="../excel.js"></script>
  <script>
  (function () {
    'use strict';

    var KB = 1024;
    var LOG_RE = /^\[(.+?)\] Target: ([\d.]+) KB -> Final: ([\d.]+) KB @ Quality: ([\d.]+)$/;

    var checks = [];
    var logs = [];
    var warns = [];

    console.log = function () {
      logs.push(Array.prototype.map.call(arguments, String).join(' '));
    };
    console.warn = function () {
      warns.push(Array.prototype.map.call(arguments, String).join(' '));
    };

    function check(name, pass, detail) {
      checks.push({
        name: name,
        pass: !!pass,
        detail: String(detail === undefined || detail === null ? '' : detail)
      });
    }

    // Synthetic source photos: solid (extremely simple), gradient + shapes
    // (mid complexity), noise (incompressible).
    function makePhoto(kind, w, h, name) {
      var c = document.createElement('canvas');
      c.width = w;
      c.height = h;
      var ctx = c.getContext('2d');

      if (kind === 'solid') {
        ctx.fillStyle = '#3a7bd5';
        ctx.fillRect(0, 0, w, h);
      } else if (kind === 'gradient') {
        var g = ctx.createLinearGradient(0, 0, w, h);
        g.addColorStop(0, '#101820');
        g.addColorStop(1, '#ffffff');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, h);
        for (var i = 0; i < 60; i++) {
          ctx.fillStyle = 'hsl(' + ((i * 9) % 360) + ', 70%, 50%)';
          ctx.beginPath();
          ctx.arc(Math.random() * w, Math.random() * h, 20 + Math.random() * 80, 0, Math.PI * 2);
          ctx.fill();
        }
      } else {
        var data = ctx.createImageData(w, h);
        for (var p = 0; p < data.data.length; p += 4) {
          data.data[p] = (Math.random() * 256) | 0;
          data.data[p + 1] = (Math.random() * 256) | 0;
          data.data[p + 2] = (Math.random() * 256) | 0;
          data.data[p + 3] = 255;
        }
        ctx.putImageData(data, 0, 0);
      }

      return new Promise(function (resolve) {
        c.toBlob(function (blob) {
          resolve(new File([blob], (name || kind) + '.jpg', { type: 'image/jpeg' }));
        }, 'image/jpeg', 0.95);
      });
    }

    // Deterministic Math.random so randomized gap formulas can be asserted.
    function withZeroRandom(fn) {
      var original = Math.random;
      Math.random = function () { return 0; };
      try {
        return fn();
      } finally {
        Math.random = original;
      }
    }

    // Regression guard: v7.0 must not have shifted a single coordinate.
    // With Math.random() === 0: horizontal gap = 3+0-1 = 2px, vertical gap =
    // 4+0-1 = 3px, height = 10cm * 37.8 = 378px, width = 378 * 800/600 = 504px.
    function testLayoutRegression() {
      var out = withZeroRandom(function () {
        return Layout.calculateLayout(
          [
            { id: 0, originalName: 'a', width: 800, height: 600 },
            { id: 1, originalName: 'b', width: 800, height: 600 },
            { id: 2, originalName: 'c', width: 800, height: 600 },
            { id: 3, originalName: 'd', width: 800, height: 600 }
          ],
          { columns: 2, targetHeightCm: 10 }
        );
      });

      var expected = [[0, 0], [506, 0], [0, 395], [506, 395]];
      var ok = out.length === expected.length;
      var detail = [];

      for (var i = 0; i < out.length; i++) {
        detail.push(out[i].x + '/' + out[i].y + ' ' + out[i].width + 'x' + out[i].height);
      }
      for (var j = 0; ok && j < expected.length; j++) {
        if (out[j].x !== expected[j][0] || out[j].y !== expected[j][1] ||
            out[j].width !== 504 || out[j].height !== 378) {
          ok = false;
        }
      }

      check('Layout.VERSION is v7.2', Layout.VERSION === 'v7.2', Layout.VERSION);
      check('layout coordinates byte-identical to v6.4 formulas', ok, detail.join(' | '));
    }

    function testExcel(layoutData) {
      if (typeof ExcelJS === 'undefined') {
        check('ExcelJS CDN reachable', false, 'skipped - CDN unreachable');
        return Promise.resolve();
      }
      check('ExcelJS CDN reachable', true, '4.4.0');

      return ExcelWriter.buildExcelWorkbook(layoutData).then(function (buffer) {
        var bytes = new Uint8Array(buffer);
        check('Excel buffer generated', bytes.length > 0, bytes.length + ' bytes');
        check('Excel buffer is a zip container',
          bytes[0] === 0x50 && bytes[1] === 0x4b, bytes[0] + ',' + bytes[1]);
      }).catch(function (err) {
        check('Excel generation completed without error', false,
          (err && err.message) || String(err));
      });
    }

    // ---- pica / fidelity helpers ------------------------------------------

    function makeCanvas(w, h) {
      var c = document.createElement('canvas');
      c.width = w;
      c.height = h;
      return c;
    }

    // Synthetic patterns built via ImageData for speed:
    //   'checker' = 1px-period black/white checkerboard (aliasing bait)
    //   'bars'    = four saturated vertical colour bars
    function patternCanvas(kind, w, h) {
      var canvas = makeCanvas(w, h);
      var ctx = canvas.getContext('2d');
      var img = ctx.createImageData(w, h);
      var d = img.data;
      var barW = Math.ceil(w / 4);

      for (var y = 0; y < h; y++) {
        for (var x = 0; x < w; x++) {
          var i = (y * w + x) * 4;
          if (kind === 'checker') {
            var v = ((x + y) % 2) ? 255 : 0;
            d[i] = d[i + 1] = d[i + 2] = v;
          } else {
            var bar = Math.min(3, Math.floor(x / barW));
            d[i] = (bar === 0 || bar === 3) ? 255 : 0;
            d[i + 1] = (bar === 1 || bar === 3) ? 255 : 0;
            d[i + 2] = (bar === 2) ? 255 : 0;
          }
          d[i + 3] = 255;
        }
      }

      ctx.putImageData(img, 0, 0);
      return canvas;
    }

    function meanChannel(canvas) {
      var ctx = canvas.getContext('2d');
      var d = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      var r = 0;
      var g = 0;
      var b = 0;
      for (var i = 0; i < d.length; i += 4) {
        r += d[i];
        g += d[i + 1];
        b += d[i + 2];
      }
      var n = d.length / 4;
      return [r / n, g / n, b / n];
    }

    // Aliasing shows up as low-frequency "beating": measure the stdev of 8x8
    // block means (an ideal low-pass result is uniform => ~0).
    function blockNoise(canvas) {
      var ctx = canvas.getContext('2d');
      var w = canvas.width;
      var h = canvas.height;
      var d = ctx.getImageData(0, 0, w, h).data;
      var means = [];

      for (var by = 0; by + 8 <= h; by += 8) {
        for (var bx = 0; bx + 8 <= w; bx += 8) {
          var sum = 0;
          for (var y = 0; y < 8; y++) {
            for (var x = 0; x < 8; x++) {
              var i = ((by + y) * w + (bx + x)) * 4;
              sum += (d[i] + d[i + 1] + d[i + 2]) / 3;
            }
          }
          means.push(sum / 64);
        }
      }

      var avg = means.reduce(function (a, b) { return a + b; }, 0) / means.length;
      var varr = means.reduce(function (a, b) { return a + (b - avg) * (b - avg); }, 0) / means.length;
      return Math.sqrt(varr);
    }

    function maxChannelDelta(a, b) {
      return Math.max(Math.abs(a[0] - b[0]), Math.abs(a[1] - b[1]), Math.abs(a[2] - b[2]));
    }

    // Objective fidelity comparison: native drawImage vs pica Lanczos3.
    async function runFidelityTests(engine) {
      // --- aliasing: non-integer-ratio checkerboard downscale --------------
      var checker = patternCanvas('checker', 1601, 1201);
      var nativeOut = makeCanvas(800, 600);
      var t0 = performance.now();
      nativeOut.getContext('2d').drawImage(checker, 0, 0, 800, 600);
      var nativeMs = performance.now() - t0;

      var picaOut = makeCanvas(800, 600);
      t0 = performance.now();
      await engine.resize(checker, picaOut, { filter: Compressor.PICA_FILTER });
      var picaMs = performance.now() - t0;

      var nativeAlias = blockNoise(nativeOut);
      var picaAlias = blockNoise(picaOut);
      check('Lanczos3 aliasing <= native (checkerboard)',
        picaAlias <= nativeAlias,
        'pica=' + picaAlias.toFixed(2) + ' native=' + nativeAlias.toFixed(2));

      // --- colour fidelity: saturated bars --------------------------------
      var bars = patternCanvas('bars', 1601, 1201);
      var expected = meanChannel(bars);

      var nativeBars = makeCanvas(800, 600);
      nativeBars.getContext('2d').drawImage(bars, 0, 0, 800, 600);
      var picaBars = makeCanvas(800, 600);
      await engine.resize(bars, picaBars, { filter: Compressor.PICA_FILTER });

      var nativeShift = maxChannelDelta(meanChannel(nativeBars), expected);
      var picaShift = maxChannelDelta(meanChannel(picaBars), expected);
      check('Lanczos3 colour shift <= native (colour bars)',
        picaShift <= nativeShift + 0.01,
        'pica=' + picaShift.toFixed(3) + ' native=' + nativeShift.toFixed(3));

      check('resize timings measured (1601x1201 -> 800x600)',
        picaMs > 0 && nativeMs > 0,
        'pica=' + picaMs.toFixed(1) + 'ms native=' + nativeMs.toFixed(1) + 'ms');
    }

    // pica engine, iOS bake cap, Lanczos3 wiring and the fallback paths.
    async function runPicaTests() {
      check('pica.min.js defines window.pica',
        typeof window.pica === 'function', typeof window.pica);

      var engine = Compressor.getPica();
      check('Compressor.getPica() returns a resize-capable instance',
        !!engine && typeof engine.resize === 'function', 'instance=' + !!engine);
      check('Compressor.PICA_FILTER is lanczos3',
        Compressor.PICA_FILTER === 'lanczos3', String(Compressor.PICA_FILTER));
      check('pica tile size is 1024',
        Compressor.PICA_TILE === 1024, String(Compressor.PICA_TILE));
      check('bake cap constants (auto strategy)',
        Compressor.ORIENT_CAP_FACTOR === 2 && Compressor.ORIENT_CAP_MIN === 1600 &&
          Compressor.BAKE_FULL_MAX_PIXELS === 4000000,
        Compressor.ORIENT_CAP_FACTOR + 'x / min' + Compressor.ORIENT_CAP_MIN +
          ' / full<=' + Compressor.BAKE_FULL_MAX_PIXELS);

      if (!engine) return;

      // NOTE: pica populates engine.features during its async init(), which is
      // triggered by the first resize() call - so feature detection is asserted
      // after the first photo below, not here.

      // Spy on resize so the bake (source) and destination sizes are visible.
      var calls = [];
      var realResize = engine.resize.bind(engine);
      engine.resize = function (from, to, opts) {
        calls.push({
          fromW: from.width || from.naturalWidth,
          toW: to.width,
          filter: opts && opts.filter
        });
        return realResize(from, to, opts);
      };

      // 1.92 MP source: full-resolution bake, pica output exactly 800x600.
      var small = await makePhoto('gradient', 1600, 1200, 'small');
      var smallPhoto = await Compressor.compressToTarget(small, { minKB: 80, maxKB: 220 });
      var last = calls[calls.length - 1];

      check('engine reported as pica', smallPhoto.engine === 'pica', smallPhoto.engine);
      check('pica downscales to exactly 800x600',
        smallPhoto.width === 800 && smallPhoto.height === 600,
        smallPhoto.width + 'x' + smallPhoto.height);
      check('<=4MP source baked at full resolution',
        !!last && last.fromW === 1600, last ? String(last.fromW) : 'no resize call');
      check('lanczos3 passed to pica.resize',
        !!last && last.filter === 'lanczos3', last ? String(last.filter) : 'no call');
      // KB logic must keep working through the pica path. A very smooth source
      // may legitimately land on Fallback A (too-simple @ 0.95) - the binary
      // search itself is exercised on the high-entropy photo in the core tests.
      var kbOk =
        smallPhoto.encoding === 'too-simple'
          ? smallPhoto.quality === 0.95 && smallPhoto.bytes < 80 * KB
          : smallPhoto.bytes >= 72 * KB && smallPhoto.bytes <= 242 * KB;
      check('KB target logic still active through pica (encoding=' +
        smallPhoto.encoding + ')', kbOk,
        (smallPhoto.bytes / KB).toFixed(1) + ' KB @ ' + smallPhoto.quality.toFixed(2));

      // Feature detection has now run inside pica's init().
      check('pica feature detection enabled js', engine.features.js === true,
        JSON.stringify(engine.features));
      check('pica backend available (wasm preferred, js fallback)',
        engine.features.wasm === true || engine.features.js === true,
        JSON.stringify(engine.features));

      // 20 MP source: the bake MUST be capped for iOS canvas safety.
      var huge = await makePhoto('gradient', 5200, 3900, 'huge');
      var hugePhoto = await Compressor.compressToTarget(huge, { minKB: 60, maxKB: 120 });
      var hugeCall = calls[calls.length - 1];

      check('20MP source downscales to exactly 800x600',
        hugePhoto.width === 800 && hugePhoto.height === 600,
        hugePhoto.width + 'x' + hugePhoto.height);
      check('20MP source bake capped at 1600px (iOS canvas safety)',
        !!hugeCall && hugeCall.fromW <= 1600 && hugeCall.toW === 800,
        hugeCall ? ('bake=' + hugeCall.fromW + ' -> ' + hugeCall.toW) : 'no call');

      await runFidelityTests(engine);

      // Forced pica failure -> native fallback, photo still produced.
      var brokenResize = engine.resize;
      engine.resize = function () {
        return Promise.reject(new Error('forced pica failure'));
      };
      var fallbackPhoto = await Compressor.compressToTarget(small, { minKB: 80, maxKB: 220 });
      engine.resize = brokenResize;

      check('pica failure falls back to native downscale',
        fallbackPhoto.engine === 'native' && fallbackPhoto.width === 800 &&
          fallbackPhoto.height === 600 && fallbackPhoto.bytes > 0,
        fallbackPhoto.engine + ' ' + fallbackPhoto.width + 'x' + fallbackPhoto.height +
          ' ' + (fallbackPhoto.bytes / KB).toFixed(1) + 'KB');
      check('pica failure logged a warning',
        warns.some(function (w) { return w.indexOf('pica resize failed') !== -1; }),
        warns.filter(function (w) { return w.indexOf('pica') !== -1; }).join(' | ') || 'none');
    }

    async function runAll() {
      // pica engine, bake cap, Lanczos3 wiring and fallback paths.
      await runPicaTests();

      // Reset the captured console output so the assertions below only see the
      // logs produced by the core compressor checks.
      logs.length = 0;
      warns.length = 0;

      // 1. Default range on a high-entropy photo: 1600x1200 noise encodes far
      // above 220 KB at quality 0.95 and far below 80 KB at 0.15, so the real
      // binary-search "hit" path is exercised (not a fallback).
      const sourcePhoto = await makePhoto('noise', 1600, 1200, 'vacation');
      const g1 = await Compressor.compressToTarget(sourcePhoto, { minKB: 80, maxKB: 220 });

      check('Compressor.VERSION is v7.2', Compressor.VERSION === 'v7.2', Compressor.VERSION);
      check('downscales to 800px width', g1.width === 800, 'width=' + g1.width);
      check('preserves aspect ratio', g1.height === 600, 'height=' + g1.height);
      check('random target inside [80,220] KB',
        g1.targetBytes >= 80 * KB && g1.targetBytes <= 220 * KB,
        (g1.targetBytes / KB).toFixed(1) + ' KB');
      check('quality inside hard bounds [0.15,0.95]',
        g1.quality >= 0.15 && g1.quality <= 0.95, g1.quality.toFixed(2));
      check('binary search hit the randomized target (encoding=' + g1.encoding + ')',
        g1.encoding === 'target' &&
          Math.abs(g1.bytes - g1.targetBytes) <= 0.10 * g1.targetBytes,
        (g1.bytes / KB).toFixed(1) + ' KB vs target ' +
          (g1.targetBytes / KB).toFixed(1) + ' KB');

      // 2. Required per-photo log line.
      const photoLogs = logs.filter((l) => LOG_RE.test(l));
      check('per-photo log matches required format', photoLogs.length === 1, photoLogs[0] || 'none');

      const m = LOG_RE.exec(photoLogs[0] || '');
      check('log numbers match the returned photo',
        !!m && m[1] === sourcePhoto.name &&
          Math.abs(parseFloat(m[2]) * KB - g1.targetBytes) < 60 &&
          Math.abs(parseFloat(m[3]) * KB - g1.bytes) < 60 &&
          Math.abs(parseFloat(m[4]) - g1.quality) < 0.01,
        photoLogs[0] || 'none');

      // 3. Target is randomized per photo, not once per run.
      const targets = [];
      const encodings = [];
      for (let i = 0; i < 3; i++) {
        const p = await Compressor.compressToTarget(sourcePhoto, { minKB: 100, maxKB: 250 });
        targets.push(p.targetBytes);
        encodings.push(p.encoding + ' q=' + p.quality.toFixed(2) +
          ' ' + (p.bytes / KB).toFixed(0) + 'KB');
      }
      check('target randomized per photo', new Set(targets).size > 1,
        targets.map((t) => (t / KB).toFixed(0)).join(', ') + ' KB');
      check('every randomized run lands on target inside the range',
        encodings.every((e) => e.indexOf('target ') === 0), encodings.join(' | '));

      // 4. Fallback A - too simple to reach the minimum size.
      logs.length = 0;
      warns.length = 0;
      const solid = await makePhoto('solid', 800, 600);
      const s1 = await Compressor.compressToTarget(solid, { minKB: 80, maxKB: 220 });
      check('Fallback A: too-simple accepted at 0.95',
        s1.encoding === 'too-simple' && s1.quality === 0.95 && s1.bytes < 80 * KB,
        s1.encoding + ' q=' + s1.quality.toFixed(2) + ' ' + (s1.bytes / KB).toFixed(1) + ' KB');
      check('Fallback A still logs and warns',
        LOG_RE.test(logs[0] || '') && warns.some((w) => w.indexOf('stays under') !== -1),
        logs[0] || 'none');

      // 5. Fallback B - too complex to reach the maximum size.
      logs.length = 0;
      warns.length = 0;
      const noise = await makePhoto('noise', 800, 600);
      const n1 = await Compressor.compressToTarget(noise, { minKB: 1, maxKB: 10 });
      check('Fallback B: too-complex clamped to 0.15',
        n1.encoding === 'too-complex' && n1.quality === 0.15 && n1.bytes > 10 * KB,
        n1.encoding + ' q=' + n1.quality.toFixed(2) + ' ' + (n1.bytes / KB).toFixed(1) + ' KB');
      check('Fallback B still logs and warns',
        LOG_RE.test(logs[0] || '') && warns.some((w) => w.indexOf('exceeds') !== -1),
        logs[0] || 'none');

      // 6. Inverted range is swapped rather than crashing.
      const inverted = await Compressor.compressToTarget(solid, { minKB: 220, maxKB: 80 });
      check('inverted range swapped (min<=max)',
        inverted.targetBytes >= 80 * KB && inverted.targetBytes <= 220 * KB,
        (inverted.targetBytes / KB).toFixed(1) + ' KB');

      // 7. Stage 1 coordinates unchanged.
      testLayoutRegression();

      // 8. Stage 2 consumes the compressed blobs unchanged.
      await testExcel([
        { blob: g1.blob, x: 0, y: 0, width: g1.width, height: g1.height },
        { blob: s1.blob, x: 510, y: 0, width: s1.width, height: s1.height }
      ]);

      const failed = checks.filter((c) => !c.pass);
      return {
        version: Compressor.VERSION,
        passed: checks.length - failed.length,
        failed: failed.length,
        checks: checks,
        finalLogs: logs
      };
    }

    // Phase 1b entry point: this page opened with ?nopica (pica.min.js absent).
    window.__runNoPicaTest = function () {
      return (async function () {
        check('pica is genuinely absent in ?nopica mode',
          typeof window.pica === 'undefined', typeof window.pica);
        check('Compressor.getPica() reports unavailable',
          Compressor.getPica() === false, 'false expected');

        var photo = await makePhoto('noise', 1600, 1200, 'offline');
        var out = await Compressor.compressToTarget(photo, { minKB: 80, maxKB: 220 });

        check('no-pica photo still downscales to 800x600',
          out.engine === 'native' && out.width === 800 && out.height === 600,
          out.engine + ' ' + out.width + 'x' + out.height);
        check('no-pica KB binary search still works',
          out.bytes >= 72 * KB && out.bytes <= 242 * KB &&
            out.quality >= 0.15 && out.quality <= 0.95,
          (out.bytes / KB).toFixed(1) + ' KB @ ' + out.quality.toFixed(2));
        check('no-pica log line keeps the required format',
          LOG_RE.test(logs[logs.length - 1] || ''), logs[logs.length - 1] || 'none');
        check('missing pica warned once',
          warns.some(function (w) { return w.indexOf('pica.js not available') !== -1; }),
          warns.filter(function (w) { return w.indexOf('pica') !== -1; }).join(' | ') || 'none');

        var failed = checks.filter(function (c) { return !c.pass; });
        return {
          kind: 'no-pica',
          passed: checks.length - failed.length,
          failed: failed.length,
          checks: checks,
          finalLogs: logs.slice(-3)
        };
      })().catch(function (err) {
        return { kind: 'no-pica', error: String((err && err.stack) || err), checks: checks };
      });
    };

    window.__runSelfTest = function () {
      return runAll().then((report) => {
        const text = JSON.stringify(report, null, 2);
        document.getElementById('out').textContent = text;
        return text;
      }).catch((err) => {
        const text = JSON.stringify({
          error: String((err && err.stack) || err), checks: checks, logs: logs
        }, null, 2);
        document.getElementById('out').textContent = text;
        return text;
      });
    };
  })();
  </script>
</body>
</html>
