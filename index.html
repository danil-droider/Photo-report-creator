<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <meta name="description" content="Photo Report Creator — an offline PWA that places photos into an Excel grid." />
  <meta name="theme-color" content="#007aff" />

  <!-- PWA / iOS "Add to Home Screen" -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Photo2Excel" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />

  <script>
    /* v7.2 — iOS standalone detection (iOS < 16.4 has no display-mode support).
       Inline and in <head> so it runs before first paint; app.js is deferred. */
    if (navigator.standalone === true ||
        window.matchMedia('(display-mode: standalone)').matches) {
      document.documentElement.classList.add('pwa-standalone');
    }
  </script>

  <link rel="stylesheet" href="./style.css" />

  <!-- ExcelJS (CDN) — used by excel.js in the export step -->
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js" defer></script>

  <!-- v9.0 — JSZip (CDN) — used by zip-exporter.js in the ZIP export step -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" defer></script>

  <title>Photo Report Creator</title>
</head>
<body>
  <main id="app">
    <header class="app-header">
      <h1>Photo Report Creator</h1>
      <span id="version-badge" class="version-badge" aria-label="App version">v9.1</span>
    </header>

    <section id="controls" aria-label="Controls">
      <div class="button-row">
        <label class="btn" for="photo-input">Choose photos</label>
        <input type="file" id="photo-input" accept="image/*" multiple hidden />
        <button type="button" id="clear-btn" class="btn btn-secondary" disabled>Clear</button>
      </div>

      <fieldset class="layout-settings">
        <legend>Layout</legend>
        <div class="field">
          <label for="height-select">Photo height</label>
          <select id="height-select">
            <option value="8">8 cm</option>
            <option value="10" selected>10 cm</option>
            <option value="12">12 cm</option>
            <option value="15">15 cm</option>
          </select>
        </div>
        <div class="field">
          <label for="columns-select">Columns</label>
          <select id="columns-select">
            <option value="1">1</option>
            <option value="2" selected>2</option>
            <option value="3">3</option>
            <option value="4">4</option>
          </select>
        </div>
      </fieldset>

      <fieldset class="layout-settings">
        <legend>Compression</legend>

        <!-- v7.4 — Quality preset segmented control. Purely a shortcut for the two
             KB inputs below: they stay enabled and editable no matter which preset
             (or Custom) is selected. Values live in Compressor.QUALITY_PRESETS. -->
        <div class="field preset-field">
          <span id="quality-preset-title">Quality preset</span>
          <span id="quality-preset-label" class="preset-label" aria-live="polite">Custom</span>
        </div>
        <div id="quality-preset" class="segmented" role="radiogroup"
             aria-labelledby="quality-preset-title">
          <button type="button" class="segmented-btn" role="radio" aria-checked="false"
                  data-preset-index="0">Low</button>
          <button type="button" class="segmented-btn" role="radio" aria-checked="false"
                  data-preset-index="1">Medium</button>
          <button type="button" class="segmented-btn" role="radio" aria-checked="false"
                  data-preset-index="2">High</button>
          <button type="button" class="segmented-btn is-active" role="radio" aria-checked="true"
                  data-preset-index="3">Custom</button>
        </div>
        <p id="quality-preset-hint" class="muted preset-hint">
          Low 20–60 KB · Medium 70–140 KB · High 140–400 KB
        </p>

        <div class="field">
          <label for="min-kb-input">Min target KB</label>
          <input type="number" id="min-kb-input" min="1" max="4096" step="1" value="80" inputmode="numeric" />
        </div>
        <div class="field">
          <label for="max-kb-input">Max target KB</label>
          <input type="number" id="max-kb-input" min="1" max="4096" step="1" value="220" inputmode="numeric" />
        </div>
      </fieldset>

      <button type="button" id="generate-btn" class="btn" disabled>
        Generate &amp; Download Excel
      </button>

      <!-- v7.3 — #file-summary is the ONLY place the idle message lives, so the
           empty selection is announced once instead of twice. -->
      <p id="file-summary" class="muted">No photos selected.</p>
      <!-- v7.3 — activity-only channel (processing / generation progress). It has
           no idle fallback text and stays hidden until there is something to
           report, so it never duplicates #file-summary. -->
      <p id="status" class="muted" aria-live="polite" hidden></p>
      <div id="loader" class="loader" hidden aria-hidden="true"></div>
            <ul id="file-list" class="file-list"></ul>
    </section>
    <section id="output" aria-label="Output"></section>
    <!-- v8.0 — Save/download confirmation dialog. A plain <div role="dialog" hidden>
         overlay, NOT a <dialog>: jsdom's HTMLDialogElement implements no
         showModal()/close(), and this reuses the app's existing [hidden] convention.
         The extension is app-owned, so the field holds a BASE name and the
         non-editable suffix shows what will actually be written.
         v8.1 — the visible heading and the hint paragraph were dropped (the
         overlay aria-label carries the accessible name) and the confirm
         button reads just "Save". -->
    <div id="save-modal" class="modal-overlay" role="dialog" aria-modal="true"
         aria-label="Save photo report" hidden>
      <div class="modal">
        <div class="modal-summary">
          <p id="save-summary-files" class="modal-metric"></p>
          <!-- Compressed size only; hidden until the whole batch is processed. -->
          <p id="save-summary-size" class="modal-metric" hidden></p>
        </div>

        <div class="field">
          <label for="save-filename">File name</label>
          <span class="modal-name-box">
            <input type="text" id="save-filename" class="modal-input"
                   maxlength="120" autocomplete="off" autocapitalize="off"
                   spellcheck="false" />
            <span id="save-filename-suffix" class="modal-suffix">.xlsx</span>
          </span>
        </div>

        <label class="modal-check" for="save-autoclear">
          <input type="checkbox" id="save-autoclear" />
          Auto-clear photo list after successful save
        </label>

        <!-- v9.0 — explicit three-button export flow, stacked full-width so the
             longest label fits on a 360px screen. Excel first (the existing
             primary path), ZIP second, Cancel last (iOS action-sheet order). -->
        <div class="modal-actions">
          <button type="button" id="save-confirm-btn" class="btn">Download Excel</button>
          <button type="button" id="save-zip-btn" class="btn">Download Photos &amp; Excel in ZIP</button>
          <button type="button" id="save-cancel-btn" class="btn btn-secondary">Cancel</button>
        </div>
      </div>
    </div>
  </main>


  <!-- Pipeline modules, loaded in dependency order -->
  <script src="./pica.min.js" defer></script>
  <script src="./compressor.js" defer></script>
  <script src="./layout.js" defer></script>
  <script src="./excel.js" defer></script>
  <!-- v9.0 — zip-exporter needs the JSZip global from the CDN tag above. -->
  <script src="./zip-exporter.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
